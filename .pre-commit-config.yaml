repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        files: ^(src/.*\.rs|tests/.*\.rs)$

      - id: cargo-clippy
        name: cargo clippy
        entry: sh -c 'SQLX_OFFLINE=true cargo clippy --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        files: ^(src/.*\.rs|tests/.*\.rs|Cargo\.(toml|lock))$

      - id: sqlx-prepare
        name: Update sqlx offline query data
        entry: scripts/sqlx-prepare.sh
        language: script
        pass_filenames: false
        files: ^(src/.*\.rs|migrations/.*)$
