name: Container
on:
  push:
    branches: [main]
    # Only rebuild images when files that affect the image content change.
    # Without this filter, every push to main (including Renovate's own
    # digest-bump merges) would build and push a new digest, which would
    # trigger the next digest-bump PR, in an endless loop.
    paths:
      - 'src/**'
      - 'templates/**'
      - 'static/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.sqlx/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/container.yml'
  release:
    types: [published]
env:
  IMAGE: ghcr.io/${{ github.repository }}
  MIGRATOR_IMAGE: ghcr.io/${{ github.repository }}-migrator
  RELEASE_TAG: ${{ github.event.release.tag_name }}
jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Derive platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_SLUG=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.PLATFORM_SLUG }}
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          tags=(-t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}")
          if [ -n "$RELEASE_TAG" ]; then
            tags+=(-t "$IMAGE:$RELEASE_TAG")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:linux-amd64" "$IMAGE:linux-arm64"
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:latest"
  build-migrator:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Derive platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_SLUG=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: migrator
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.MIGRATOR_IMAGE }}:${{ env.PLATFORM_SLUG }}
          cache-from: type=gha,scope=migrator-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=migrator-${{ env.PLATFORM_SLUG }}
  publish-migrator:
    needs: build-migrator
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          tags=(-t "$MIGRATOR_IMAGE:latest" -t "$MIGRATOR_IMAGE:sha-${GITHUB_SHA::7}")
          if [ -n "$RELEASE_TAG" ]; then
            tags+=(-t "$MIGRATOR_IMAGE:$RELEASE_TAG")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$MIGRATOR_IMAGE:linux-amd64" "$MIGRATOR_IMAGE:linux-arm64"
      - name: Inspect
        run: docker buildx imagetools inspect "$MIGRATOR_IMAGE:latest"
