<div class="action-item editing"
     data-action-item-id="{{ action_item.id }}"
     data-created-at="{{ action_item.created_at.to_rfc3339() }}">
  <form hx-post="/action-items/{{ action_item.id }}"
        hx-target="closest .action-item"
        hx-swap="outerHTML"
        hx-status:400="target:#action-item-error-{{ action_item.id }} swap:innerHTML"
        hx-disable="find .btn-save-edit"
        hx-browser-indicator="true">
    <textarea class="edit-card-input"
              name="text"
              rows="1"
              aria-label="Action item text"
              required
              autofocus>{{ action_item.text }}</textarea>
    <div class="inline-error-slot" id="action-item-error-{{ action_item.id }}"></div>
    <div class="card-actions">
      <button class="btn-secondary secondary btn-cancel-edit"
              type="button"
              hx-get="/action-items/{{ action_item.id }}"
              hx-target="closest .action-item"
              hx-swap="outerHTML">
        Cancel
      </button>
      <button class="btn-primary primary btn-save-edit" type="submit">Save</button>
    </div>
  </form>
</div>
