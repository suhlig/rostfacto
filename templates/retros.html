{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Retrospectives</h1>

    <table role="grid">
        <thead>
            <tr>
                <th scope="col">Title</th>
                <th scope="col">Created</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for retro in retros %}
            <tr>
                <td><a href="/retro/{{ retro.slug }}">{{ retro.title }}</a></td>
                <td>{{ retro.created_at.format("%Y-%m-%d %H:%M") }}</td>
                <td>
                    <button class="delete-btn secondary"
                            hx-delete="/retro/{{ retro.slug }}/delete"
                            hx-confirm="Are you sure you want to delete this retrospective?"
                            hx-target="closest tr"
                            hx-swap="outerHTML">
                        Delete
                    </button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
