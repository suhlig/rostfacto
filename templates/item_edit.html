<article class="card editing" data-item-id="{{ item.id }}" data-updated-at="{{ item.updated_at.timestamp_millis() }}">
  <form hx-post="/items/{{ item.id }}"
        hx-target="closest .card"
        hx-swap="outerHTML"
        hx-status:400="target:#item-error-{{ item.id }} swap:innerHTML"
        hx-disable="find .btn-save-edit"
        hx-browser-indicator="true">
    <textarea class="edit-card-input"
              name="text"
              rows="3"
              aria-label="Card text"
              required
              autofocus>{{ item.text }}</textarea>
    <div class="inline-error-slot" id="item-error-{{ item.id }}"></div>
    <div class="card-actions">
      <button class="btn-secondary secondary btn-cancel-edit"
              type="button"
              hx-get="/items/{{ item.id }}"
              hx-target="closest .card"
              hx-swap="outerHTML">
        Cancel
      </button>
      <button class="btn-primary primary btn-save-edit" type="submit">Save</button>
    </div>
  </form>
</article>
