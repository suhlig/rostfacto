<div class="action-item{% if action_item.completed_at.is_some() %} completed{% endif %}"
     data-action-item-id="{{ action_item.id }}"
     data-created-at="{{ action_item.created_at.to_rfc3339() }}">
  {% if action_item.completed_at.is_some() %}
    <span class="action-item-checkbox checked" aria-hidden="true">✓</span>
  {% else if action_item.archive_id.is_some() %}
    <span class="action-item-checkbox" aria-hidden="true"></span>
  {% else %}
    <button type="button"
            class="action-item-checkbox"
            aria-label="Complete action item"
            hx-post="/action-items/{{ action_item.id }}/complete"
            hx-target="closest .action-item"
            hx-swap="outerHTML"></button>
  {% endif %}
  <span class="action-item-text">{{ action_item.text }}</span>
  {% if action_item.archive_id.is_none() %}
  <button type="button"
          class="action-item-edit"
          aria-label="Edit action item"
          hx-get="/action-items/{{ action_item.id }}/edit"
          hx-target="closest .action-item"
          hx-swap="outerHTML">✎</button>
  <button type="button"
          class="action-item-delete"
          aria-label="Delete action item"
          data-open-dialog="action-item-delete-confirm-{{ action_item.id }}">×</button>
  <dialog id="action-item-delete-confirm-{{ action_item.id }}" class="archive-confirm-dialog action-item-delete-dialog">
    <article>
      <h3>Delete this action item?</h3>
      <p>Are you sure you want to delete this action item?</p>
      <form hx-delete="/action-items/{{ action_item.id }}"
            hx-target="closest .action-item"
            hx-swap="outerHTML">
        <fieldset class="grid">
          <legend class="visually-hidden">Delete actions</legend>
          <button type="button" class="btn-cancel secondary" data-close-dialog>Cancel</button>
          <button type="submit" class="btn-primary primary">Delete</button>
        </fieldset>
      </form>
    </article>
  </dialog>
  {% endif %}
</div>
