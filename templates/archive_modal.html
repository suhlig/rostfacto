<div>
  {{ text }}
  <dialog id="archive-modal" open>
    <article>
      <h3>Archive All Cards?</h3>
      <form method="POST" action="/retro/{{ retro_id }}/archive">
        <button class="secondary" value="cancel" formmethod="dialog" onclick="this.closest('dialog').close()">No</button>
        <input  class="primary"   type="submit"  value="Yes"/>
      </form>
    </article>
  </dialog>
</div>


<button id="confirmBtn" value="default">Confirm</button>
