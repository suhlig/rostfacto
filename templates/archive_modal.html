<article class="card completed" data-item-id="{{ item.id }}">{{ item.text }}</article>

<dialog id="archive-modal" open>
  <article>
    <h3>Archive All Cards?</h3>
    <form method="POST" action="/retro/{{ item.retro_id }}/archive">
      <fieldset class="grid">
        <button class="secondary" formmethod="dialog" onclick="this.closest('dialog').close()">No</button>
        <button class="primary" formmethod="post">Yes</button>
      </fieldset>
    </form>
  </article>
</dialog>
