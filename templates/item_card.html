{% match item.status %}
  {% when Status::Highlighted %}
    <article class="card highlighted" data-item-id="{{ item.id }}">
      <p>{{ item.text }}</p>
      <form>
        <fieldset class="grid" style="margin-bottom: 0px; padding-left: 50%">
          <button class="secondary"
                  hx-post="/items/{{ item.id }}/status?action=cancel"
                  hx-target="closest .card"
                  hx-swap="outerHTML">
            Cancel
          </button>
          <button class="primary"
                  hx-post="/items/{{ item.id }}/status?action=complete"
                  hx-target="closest .card"
                  hx-swap="outerHTML">
            Complete
          </button>
        </fieldset>
      </form>
    </article>
  {% when Status::Completed %}
    <article class="card completed" data-item-id="{{ item.id }}">{{ item.text }}</article>
  {% else %}
    <article class="card"
             data-item-id="{{ item.id }}"
             hx-post="/items/{{ item.id }}/status?action=highlight"
             hx-target="closest .card"
             hx-swap="outerHTML"
    >
        {{ item.text }}
    </article>
{% endmatch %}
