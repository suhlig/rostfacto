{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>New Retrospective</h1>
    <form method="POST" action="/retros">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>
        <label for="slug">Slug</label>
        <input type="text" id="slug" name="slug" required
               pattern="[a-z0-9-]+"
               maxlength="255"
        >
        <small id="slug">
          Lowercase letters, numbers and dashes only; up to 255 characters
        </small>
        <input type="submit" value="Create Retrospective">
    </form>
</div>
{% endblock %}
