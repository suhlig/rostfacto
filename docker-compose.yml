# Production-oriented stack: all secrets come from the environment (see
# .env.example). The app connects to the database as the least-privilege
# `rostfacto_app` role created by docker/init-app-role.sh on first boot;
# only the one-shot migrations service uses the superuser.
services:
  db:
    # Pinned by digest for reproducible deployments.
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: rostfacto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env}
      POSTGRES_DB: rostfacto
      # Only used by the init script that creates the app role.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in your .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rostfacto -d rostfacto"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrations:
    image: ghcr.io/suhlig/rostfacto-migrator@sha256:75c89c051cd3340e0ccdaf4ade233c003ed5b1b67f06ca8a70fa673f2062a9c6
    environment:
      DATABASE_URL: postgres://rostfacto:${POSTGRES_PASSWORD}@db/rostfacto
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/suhlig/rostfacto@sha256:572c294aa40f1d3f69829a89299d3406a77ab42f4bf0718d161bb6ab71766e52
    environment:
      DATABASE_URL: postgres://rostfacto_app:${POSTGRES_APP_PASSWORD}@db/rostfacto
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in your .env (the public base URL used for OAuth)}
      GITHUB_ADMIN_ORG: ${GITHUB_ADMIN_ORG:?Set GITHUB_ADMIN_ORG in your .env}
      GITHUB_ADMIN_TEAM_SLUG: ${GITHUB_ADMIN_TEAM_SLUG:?Set GITHUB_ADMIN_TEAM_SLUG in your .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID in your .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET in your .env}
      GITHUB_USER_ORG: ${GITHUB_USER_ORG:-}
      GITHUB_APP_OWNER: ${GITHUB_APP_OWNER:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
