# All secrets come from the environment (see .env.example). The app connects
# to the database as the least-privilege `rostfacto_app` role created by
# docker/init-app-role.sh on first boot; only the one-shot migrations service
# uses the superuser.
#
# The stack runs with GitHub authentication when GITHUB_ADMIN_ORG and the
# other GitHub variables are set in .env. For an unsecured local demo, set
# DEMO_MODE=1 instead and leave the GitHub variables blank; the app fails
# closed at startup if neither DEMO_MODE nor a complete GitHub configuration
# is present. Never run DEMO_MODE in production.
services:
  db:
    # Pinned by digest for reproducible deployments.
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: rostfacto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env}
      POSTGRES_DB: rostfacto
      # Only used by the init script that creates the app role.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in your .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rostfacto -d rostfacto"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrations:
    image: ghcr.io/suhlig/rostfacto-migrator@sha256:776628904500c3823756f97664221e6cf5d9b7e1ccddd18c68e4cc1f82c74574
    environment:
      DATABASE_URL: postgres://rostfacto:${POSTGRES_PASSWORD}@db/rostfacto
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/suhlig/rostfacto@sha256:8cd31a99c1a0587685ce3d60a627e8498a27508d13462c2bae2be5f438c37019
    environment:
      DATABASE_URL: postgres://rostfacto_app:${POSTGRES_APP_PASSWORD}@db/rostfacto
      # GitHub auth variables are optional so that .env can opt into the
      # unsecured DEMO_MODE=1; blank values count as unset (the app fails
      # closed when neither DEMO_MODE=1 nor the GitHub config is present).
      DEMO_MODE: ${DEMO_MODE:-0}
      PUBLIC_URL: ${PUBLIC_URL:-}
      GITHUB_ADMIN_ORG: ${GITHUB_ADMIN_ORG:-}
      GITHUB_ADMIN_TEAM_SLUG: ${GITHUB_ADMIN_TEAM_SLUG:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_USER_ORG: ${GITHUB_USER_ORG:-}
      GITHUB_APP_OWNER: ${GITHUB_APP_OWNER:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
