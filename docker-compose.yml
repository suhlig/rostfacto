services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rostfacto
      POSTGRES_PASSWORD: rostfacto
      POSTGRES_DB: rostfacto
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rostfacto -d rostfacto"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrations:
    image: ghcr.io/suhlig/rostfacto-migrator:latest
    environment:
      DATABASE_URL: postgres://rostfacto:rostfacto@db/rostfacto
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/suhlig/rostfacto:latest
    environment:
      DATABASE_URL: postgres://rostfacto:rostfacto@db/rostfacto
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
